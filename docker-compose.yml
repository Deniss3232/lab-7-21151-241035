services:

  postgres:
    image: postgres:16
    container_name: retailmax_db

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: retailmax

    ports:
      - "5434:5432"

    volumes:
      - ./DDL.sql:/docker-entrypoint-initdb.d/1-DDL.sql
      - ./DATA.sql:/docker-entrypoint-initdb.d/2-DATA.sql

  metabase:
    image: metabase/metabase:latest
    container_name: retailmax_metabase

    ports:
      - "3000:3000"

    volumes:
      - ./metabase-data:/metabase-data

    environment:
      MB_DB_FILE: /metabase-data/metabase.db

    depends_on:
      - postgres
